<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ambilight Diagnostics</title>
<style>
body { background:#111; color:white; font:24px sans-serif; padding:35px; }
button { font-size:25px; padding:18px; margin:10px 0; }
pre { white-space:pre-wrap; font-size:21px; }
</style>
</head>
<body>
<h2>Ambilight Diagnostics</h2>
<button onclick="this.textContent='CLICK WORKS'; runProbe()">Run diagnostics</button>
<pre id="result">Connecting...</pre>
<script>
var output = document.getElementById("result");
var ws;
var moduleName = "gh/victor-sem/amb";

function connect() {
    ws = new WebSocket("ws://localhost:8081");

    ws.onopen = function() {
        output.textContent = "Connected. Ready.";
        getStatus();
    };

    ws.onmessage = function(event) {
        var data = JSON.parse(event.data);
        if (data.type === 7) {
            output.textContent = JSON.stringify(data.payload, null, 2);
        }
    };

    ws.onerror = function() {
        output.textContent = "Connection error";
    };
}

function getStatus() {
    ws.send(JSON.stringify({type:7}));
}

function runProbe() {
    output.textContent = "Running diagnostics...";
    fetch("https://api.github.com/repos/victor-sem/amb/commits/main")
    .then(function(r) { return r.json(); })
    .then(function(commit) {
        ws.send(JSON.stringify({
        type:6,
        payload:{
            fullName:moduleName + "@" + commit.sha,
            serviceFile:"service.js"
        }
    }));
        setTimeout(getStatus, 3000);
    }).catch(function(e) {
        output.textContent = "GitHub error: " + e.message;
    });
}

connect();
</script>
</body>
</html>
